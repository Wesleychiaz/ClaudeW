<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wesley Snake Game</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #131720; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: 'Courier New', monospace; }
    #game-wrap { display: flex; flex-direction: column; align-items: center; padding: 1.5rem 0; }
    #screen { background: #1e2433; border: 4px solid #252d3d; border-radius: 6px; position: relative; }
    canvas { display: block; image-rendering: pixelated; }
    #score-bar { display: flex; justify-content: space-between; width: 100%; max-width: 280px; margin-bottom: 8px; font-size: 13px; color: #8899aa; letter-spacing: 1px; text-transform: uppercase; }
    #score-bar strong { color: #5bc8f5; }
    #msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(20,25,40,0.95); color: #5bc8f5; padding: 12px 20px; border-radius: 4px; text-align: center; font-size: 13px; line-height: 1.8; pointer-events: none; white-space: nowrap; }
    #dpad { display: grid; grid-template-columns: repeat(3, 48px); grid-template-rows: repeat(3, 48px); gap: 4px; margin-top: 16px; }
    #dpad button { width: 48px; height: 48px; background: #1e2433; border: 1px solid #2e3a50; border-radius: 8px; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #5bc8f5; user-select: none; -webkit-tap-highlight-color: transparent; transition: background 0.1s; }
    #dpad button:active { background: #2e3a50; transform: scale(0.93); }
    #dpad .empty { visibility: hidden; }
    #bottom-bar { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
    #start-btn { padding: 8px 28px; font-family: 'Courier New', monospace; font-size: 13px; letter-spacing: 1px; cursor: pointer; background: #252d3d; color: #5bc8f5; border: 1px solid #2e3a50; border-radius: 4px; text-transform: uppercase; transition: background 0.1s; }
    #start-btn:hover { background: #2e3a50; }
    #music-toggle { padding: 8px 16px; font-family: 'Courier New', monospace; font-size: 13px; letter-spacing: 1px; cursor: pointer; border: 1px solid #2e3a50; border-radius: 4px; background: #5bc8f5; color: #1e2433; text-transform: uppercase; transition: background 0.1s; }
    #music-toggle.off { background: #1e2433; color: #5bc8f5; }
    #music-toggle:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <div id="game-wrap">
    <div id="score-bar">
      <span>Score: <strong id="score-val">0</strong></span>
      <span>Best: <strong id="best-val">0</strong></span>
    </div>
    <div id="screen">
      <canvas id="c" width="280" height="280"></canvas>
      <div id="msg">SNAKEY<br><span style="font-size:11px;opacity:0.8">Press Start</span></div>
    </div>
    <div id="dpad">
      <div class="empty"></div>
      <button id="btn-up" aria-label="Up">&#8679;</button>
      <div class="empty"></div>
      <button id="btn-left" aria-label="Left">&#8678;</button>
      <div class="empty"></div>
      <button id="btn-right" aria-label="Right">&#8680;</button>
      <div class="empty"></div>
      <button id="btn-down" aria-label="Down">&#8681;</button>
      <div class="empty"></div>
    </div>
    <div id="bottom-bar">
      <button id="start-btn">&#9654; Start</button>
      <button id="music-toggle">&#9834; Music: On</button>
    </div>
  </div>

  <script>
    const COLS=20,ROWS=20,CELL=14;
    const BG='#1e2433',SNAKE_COL='#5bc8f5',FOOD_COL='#f03060',DOT_COL='#252d3d';
    const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
    const scoreEl=document.getElementById('score-val'),bestEl=document.getElementById('best-val'),msgEl=document.getElementById('msg');
    let snake,dir,nextDir,food,score,best=0,running,gameLoop,speed;
    let audioCtx=null,gainNode=null,activeOscs=[],musicSessionId=0,musicOn=true;

    function getAC(){
      if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
      return audioCtx;
    }

    function stopMusic(){
      musicSessionId++;
      activeOscs.forEach(o=>{try{o.stop();}catch(e){}});
      activeOscs=[];
      if(gainNode){gainNode.disconnect();gainNode=null;}
    }

    function scheduleNotes(ac,gain,notes,wave,detune){
      let t=ac.currentTime+0.05;
      notes.forEach(([freq,len])=>{
        if(freq>0){
          const o=ac.createOscillator(),g=ac.createGain();
          o.type=wave; o.frequency.value=freq;
          if(detune) o.detune.value=detune;
          g.gain.setValueAtTime(0.001,t);
          g.gain.linearRampToValueAtTime(1,t+0.01);
          g.gain.setTargetAtTime(0,t+len*0.65,0.04);
          o.connect(g); g.connect(gain);
          o.start(t); o.stop(t+len);
          activeOscs.push(o);
        }
        t+=len;
      });
      return t-ac.currentTime;
    }

    function loopChiptune(ac,gain,sid){
      if(musicSessionId!==sid) return;
      const mel=[[659,0.15],[659,0.15],[0,0.05],[784,0.15],[659,0.15],[0,0.05],[523,0.15],[587,0.15],[523,0.15],[0,0.1],[440,0.15],[440,0.15],[0,0.05],[523,0.15],[440,0.15],[0,0.05],[349,0.15],[392,0.15],[349,0.15],[0,0.2],[392,0.15],[392,0.15],[0,0.05],[659,0.15],[587,0.15],[523,0.15],[0,0.1],[494,0.3],[0,0.1]];
      const bass=[[196,0.3],[196,0.3],[220,0.3],[196,0.3],[174,0.3],[196,0.6]];
      const dur=scheduleNotes(ac,gain,mel,'square',0);
      scheduleNotes(ac,gain,bass,'square',-1200);
      setTimeout(()=>loopChiptune(ac,gain,sid),(dur-0.1)*1000);
    }

    function startMusic(){
      stopMusic();
      if(!musicOn) return;
      const ac=getAC();
      gainNode=ac.createGain();
      gainNode.gain.value=0.25;
      gainNode.connect(ac.destination);
      const sid=musicSessionId;
      loopChiptune(ac,gainNode,sid);
    }

    const musicToggleBtn=document.getElementById('music-toggle');
    musicToggleBtn.addEventListener('click',()=>{
      musicOn=!musicOn;
      musicToggleBtn.textContent=musicOn?'\u266a Music: On':'\u266a Music: Off';
      musicToggleBtn.classList.toggle('off',!musicOn);
      if(running){ if(musicOn) startMusic(); else stopMusic(); }
    });

    function init(){
      snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
      dir={x:1,y:0}; nextDir={x:1,y:0};
      score=0; speed=100;
      scoreEl.textContent='0';
      placeFood();
      msgEl.style.display='none';
      running=true;
      clearInterval(gameLoop);
      gameLoop=setInterval(tick,speed);
      startMusic();
    }

    function placeFood(){
      let pos;
      do{pos={x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS)};}
      while(snake.some(s=>s.x===pos.x&&s.y===pos.y));
      food=pos;
    }

    function tick(){
      dir=nextDir;
      const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
      if(head.x<0||head.x>=COLS||head.y<0||head.y>=ROWS||snake.some(s=>s.x===head.x&&s.y===head.y)){
        clearInterval(gameLoop); running=false; stopMusic();
        if(score>best){best=score;bestEl.textContent=best;}
        msgEl.innerHTML='GAME OVER<br><span style="font-size:11px;opacity:0.8">Score: '+score+' — Press Start</span>';
        msgEl.style.display='block'; draw(); return;
      }
      snake.unshift(head);
      if(head.x===food.x&&head.y===food.y){
        score++; scoreEl.textContent=score; placeFood();
        if(score%5===0&&speed>55){speed=Math.max(55,speed-10);clearInterval(gameLoop);gameLoop=setInterval(tick,speed);}
      } else { snake.pop(); }
      draw();
    }

    function draw(){
      ctx.fillStyle=BG; ctx.fillRect(0,0,280,280);
      ctx.fillStyle=DOT_COL;
      for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) ctx.fillRect(c*CELL+6,r*CELL+6,2,2);
      ctx.fillStyle=FOOD_COL;
      ctx.beginPath();
      ctx.arc(food.x*CELL+CELL/2,food.y*CELL+CELL/2,5,0,Math.PI*2);
      ctx.fill();
      ctx.fillStyle=SNAKE_COL;
      snake.forEach((seg,i)=>{
        const sx=seg.x*CELL+1,sy=seg.y*CELL+1,sz=CELL-2;
        ctx.beginPath(); ctx.roundRect(sx,sy,sz,sz,4); ctx.fill();
        if(i===0){
          ctx.fillStyle=BG;
          const ex=dir.x,ey=dir.y;
          if(ex===1){ctx.fillRect(sx+8,sy+2,2,2);ctx.fillRect(sx+8,sy+8,2,2);}
          else if(ex===-1){ctx.fillRect(sx+2,sy+2,2,2);ctx.fillRect(sx+2,sy+8,2,2);}
          else if(ey===1){ctx.fillRect(sx+2,sy+8,2,2);ctx.fillRect(sx+8,sy+8,2,2);}
          else{ctx.fillRect(sx+2,sy+2,2,2);ctx.fillRect(sx+8,sy+2,2,2);}
          ctx.fillStyle=SNAKE_COL;
        }
      });
    }

    document.addEventListener('keydown',e=>{
      if(!running) return;
      if(e.key==='ArrowUp'&&dir.y!==1) nextDir={x:0,y:-1};
      else if(e.key==='ArrowDown'&&dir.y!==-1) nextDir={x:0,y:1};
      else if(e.key==='ArrowLeft'&&dir.x!==1) nextDir={x:-1,y:0};
      else if(e.key==='ArrowRight'&&dir.x!==-1) nextDir={x:1,y:0};
      if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault();
    });

    function dpadPress(dx,dy){
      if(!running) return;
      if(dy===-1&&dir.y!==1) nextDir={x:0,y:-1};
      else if(dy===1&&dir.y!==-1) nextDir={x:0,y:1};
      else if(dx===-1&&dir.x!==1) nextDir={x:-1,y:0};
      else if(dx===1&&dir.x!==-1) nextDir={x:1,y:0};
    }

    document.getElementById('btn-up').addEventListener('click',()=>dpadPress(0,-1));
    document.getElementById('btn-down').addEventListener('click',()=>dpadPress(0,1));
    document.getElementById('btn-left').addEventListener('click',()=>dpadPress(-1,0));
    document.getElementById('btn-right').addEventListener('click',()=>dpadPress(1,0));
    document.getElementById('start-btn').addEventListener('click',init);

    ctx.fillStyle=BG; ctx.fillRect(0,0,280,280);
  </script>
</body>
</html>
