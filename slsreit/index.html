<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Soon Lian's REIT Guide 🏢</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; background: #FAFAF7; color: #1A1A1A; line-height: 1.65; -webkit-font-smoothing: antialiased; }
    h1,h2,h3,h4 { font-family: 'Playfair Display', serif; line-height: 1.25; }
    .nav { position: sticky; top: 0; z-index: 100; background: rgba(250,250,247,0.95); backdrop-filter: blur(12px); border-bottom: 1px solid #E8E5DE; padding: 0 24px; display: flex; align-items: center; height: 60px; }
    .nav-brand { font-family: 'Playfair Display', serif; font-size: 1.1rem; color: #2C6E49; font-weight: 700; margin-right: auto; white-space: nowrap; display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .nav-links { display: flex; gap: 4px; flex-wrap: wrap; }
    .nav-btn { background: none; border: none; cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 0.8rem; font-weight: 500; color: #6B6B6B; padding: 6px 10px; border-radius: 6px; transition: all 0.2s; white-space: nowrap; }
    .nav-btn:hover { color: #2C6E49; background: #D4EDDA; }
    .nav-btn.active { color: #2C6E49; background: #D4EDDA; font-weight: 600; }
    .hero { background: linear-gradient(135deg, #1A3A2A 0%, #2C6E49 60%, #4A9E6E 100%); color: white; padding: 80px 40px 60px; text-align: center; position: relative; overflow: hidden; }
    .hero::before { content: ''; position: absolute; inset: 0; background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E"); opacity: 0.4; }
    .hero-pill { display: inline-block; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); padding: 4px 14px; border-radius: 20px; font-size: 0.8rem; margin-bottom: 20px; letter-spacing: 0.5px; position: relative; }
    .hero h1 { font-size: clamp(2rem, 5vw, 3.2rem); margin-bottom: 16px; position: relative; }
    .hero p { font-size: 1.05rem; opacity: 0.85; max-width: 560px; margin: 0 auto 32px; position: relative; }
    .hero-cta { display: inline-flex; align-items: center; gap: 8px; background: white; color: #2C6E49; padding: 12px 28px; border-radius: 8px; font-weight: 600; font-size: 0.95rem; cursor: pointer; border: none; transition: transform 0.2s, box-shadow 0.2s; box-shadow: 0 4px 16px rgba(0,0,0,0.2); position: relative; font-family: 'DM Sans', sans-serif; }
    .hero-cta:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.25); }
    .section { max-width: 900px; margin: 0 auto; padding: 60px 24px; }
    .section-title { font-size: clamp(1.6rem, 3vw, 2.2rem); color: #2C6E49; margin-bottom: 8px; }
    .section-sub { color: #6B6B6B; margin-bottom: 40px; font-size: 0.95rem; }
    .card { background: #FFFFFF; border: 1px solid #E8E5DE; border-radius: 12px; padding: 24px; transition: box-shadow 0.2s, transform 0.2s; }
    .card:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.08); transform: translateY(-1px); }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.4px; text-transform: uppercase; }
    .badge-green { background: #D4EDDA; color: #2C6E49; }
    .badge-gold  { background: #FDF3DC; color: #C4922A; }
    .badge-blue  { background: #DFF0F7; color: #1A6B8A; }
    .badge-red   { background: #FDECEA; color: #C0392B; }
    .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 28px; }
    .tab { padding: 8px 18px; border-radius: 20px; border: 1.5px solid #E8E5DE; background: none; cursor: pointer; font-size: 0.875rem; font-weight: 500; color: #6B6B6B; transition: all 0.2s; font-family: 'DM Sans', sans-serif; }
    .tab.active { background: #2C6E49; color: white; border-color: #2C6E49; }
    .tab:hover:not(.active) { border-color: #2C6E49; color: #2C6E49; }
    .callout { border-left: 4px solid #2C6E49; background: #D4EDDA; padding: 16px 20px; border-radius: 0 8px 8px 0; margin: 20px 0; font-size: 0.92rem; }
    .callout-warn { border-left-color: #C4922A; background: #FDF3DC; }
    .callout-danger { border-left-color: #C0392B; background: #FDECEA; }
    .table-wrap { overflow-x: auto; border-radius: 10px; border: 1px solid #E8E5DE; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th { background: #2C6E49; color: white; padding: 10px 14px; text-align: left; font-weight: 600; white-space: nowrap; }
    td { padding: 10px 14px; border-bottom: 1px solid #E8E5DE; }
    tr:last-child td { border-bottom: none; }
    tr:nth-child(even) td { background: #F6F6F2; }
    .metric-card { background: #FFFFFF; border: 1px solid #E8E5DE; border-radius: 10px; padding: 20px; text-align: center; }
    .metric-card .num { font-family: 'Playfair Display', serif; font-size: 2rem; font-weight: 700; color: #2C6E49; }
    .metric-card .label { font-size: 0.8rem; color: #6B6B6B; margin-top: 4px; }
    .calc-group { margin-bottom: 20px; }
    .calc-label { display: block; font-size: 0.85rem; font-weight: 600; color: #6B6B6B; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.4px; }
    .calc-input { width: 100%; padding: 10px 14px; border: 1.5px solid #E8E5DE; border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 0.95rem; outline: none; transition: border 0.2s; background: #FAFAF7; }
    .calc-input:focus { border-color: #2C6E49; }
    .calc-result { background: linear-gradient(135deg, #2C6E49, #4A9E6E); color: white; border-radius: 10px; padding: 20px; text-align: center; margin-top: 20px; }
    .calc-result .big { font-family: 'Playfair Display', serif; font-size: 2.4rem; font-weight: 700; }
    .calc-result .small { font-size: 0.85rem; opacity: 0.85; margin-top: 4px; }
    .btn-primary { background: #2C6E49; color: white; border: none; padding: 11px 24px; border-radius: 8px; cursor: pointer; font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 0.9rem; transition: background 0.2s, transform 0.15s; }
    .btn-primary:hover { background: #235539; transform: translateY(-1px); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .quiz-card { background: #FFFFFF; border: 1px solid #E8E5DE; border-radius: 12px; padding: 32px; max-width: 680px; margin: 0 auto; }
    .quiz-q { font-size: 1.1rem; font-weight: 600; margin-bottom: 20px; line-height: 1.5; }
    .quiz-opt { display: block; width: 100%; background: #FAFAF7; border: 1.5px solid #E8E5DE; padding: 12px 18px; border-radius: 8px; margin-bottom: 10px; text-align: left; cursor: pointer; font-size: 0.9rem; font-family: 'DM Sans', sans-serif; transition: all 0.2s; }
    .quiz-opt:hover:not(:disabled) { border-color: #2C6E49; background: #D4EDDA; }
    .quiz-opt.correct { border-color: #2C6E49; background: #D4EDDA; color: #2C6E49; font-weight: 600; }
    .quiz-opt.wrong   { border-color: #C0392B; background: #FDECEA; color: #C0392B; }
    .quiz-opt:disabled { cursor: default; }
    .quiz-progress { display: flex; gap: 6px; margin-bottom: 24px; }
    .quiz-dot { height: 6px; border-radius: 3px; flex: 1; background: #E8E5DE; transition: background 0.3s; }
    .quiz-dot.done { background: #2C6E49; }
    .quiz-dot.current { background: #C4922A; }
    .compare-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    .compare-table th, .compare-table td { padding: 12px 16px; text-align: center; border: 1px solid #E8E5DE; }
    .compare-table th { background: #2C6E49; color: white; }
    .compare-table td:first-child { text-align: left; font-weight: 600; background: #FAFAF7; }
    .compare-table .highlight { background: #D4EDDA; }
    .icon-box { font-size: 2.2rem; margin-bottom: 12px; }
    .step-num { flex-shrink: 0; width: 36px; height: 36px; border-radius: 50%; background: #2C6E49; color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.9rem; }
    .pitfall-card { border: 1.5px solid #C0392B; border-radius: 10px; padding: 20px; background: #FDECEA; }
    .pitfall-card h4 { color: #C0392B; margin-bottom: 8px; }
    .ai-chat-box { background: #FAFAF7; border: 1.5px solid #E8E5DE; border-radius: 12px; padding: 20px; min-height: 80px; font-size: 0.9rem; line-height: 1.7; color: #1A1A1A; white-space: pre-wrap; }
    .ai-thinking { color: #6B6B6B; font-style: italic; }
    footer { background: #1A3A2A; color: rgba(255,255,255,0.6); text-align: center; padding: 28px 24px; font-size: 0.82rem; margin-top: 60px; }
    footer strong { color: white; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .fade-up { animation: fadeUp 0.5s ease forwards; }
    @media (max-width: 600px) { .nav-links { display: none; } .hero { padding: 60px 20px 40px; } .section { padding: 40px 16px; } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    const C = {
      bg:"#FAFAF7", surface:"#FFFFFF", border:"#E8E5DE", accent:"#2C6E49",
      accentL:"#4A9E6E", accentXL:"#D4EDDA", gold:"#C4922A", goldL:"#FDF3DC",
      text:"#1A1A1A", muted:"#6B6B6B", danger:"#C0392B", dangerL:"#FDECEA",
      info:"#1A6B8A", infoL:"#DFF0F7"
    };

    const PAGES = ["Home","What is a REIT?","Types of REITs","REITs vs Others","How to Analyse","Pitfalls","Calculators","Quiz","Ask AI"];

    const REIT_TYPES = [
      { icon:"🛍️", name:"Retail REITs", badge:"badge-green",
        examples:"CapitaLand Integrated Commercial Trust (CICT), Frasers Centrepoint Trust (FCT)",
        pros:["Easy to evaluate — walk into the mall!","High foot traffic in dense Singapore","Stable income from long leases"],
        cons:["E-commerce pressure on physical retail","Sensitivity to consumer spending"],
        description:"REITs that own shopping malls. Singapore's climate, high population density, and tourism make malls hugely popular. You can literally walk into a CapitaLand mall and judge the quality yourself — that's the transparency edge." },
      { icon:"🏢", name:"Office REITs", badge:"badge-blue",
        examples:"Keppel REIT, Manulife US REIT",
        pros:["Long leases (3–5 years)","Premium CBD locations","Beneficiary of Singapore as business hub"],
        cons:["Work-from-home trends","Oversupply risk in certain submarkets"],
        description:"REITs that own office buildings in Singapore's CBD and business parks. Companies like banks and tech firms are tenants. Good news: Singapore remains a top regional HQ destination." },
      { icon:"🏭", name:"Industrial REITs", badge:"badge-gold",
        examples:"Ascendas REIT, Mapletree Logistics Trust (MLT), Mapletree Industrial Trust (MINT)",
        pros:["Huge portfolio diversification","Rides e-commerce & logistics boom","Stable tenants (manufacturers, logistics)"],
        cons:["Low organic rental growth","Need constant acquisitions to grow DPU"],
        description:"Own warehouses, logistics hubs, business parks and flatted factories. The e-commerce boom has made logistics properties incredibly valuable — think last-mile delivery warehouses." },
      { icon:"🏨", name:"Hospitality REITs", badge:"badge-red",
        examples:"CDL Hospitality Trusts, Far East Hospitality Trust",
        pros:["Rides recovery in Singapore tourism","Variable rents can capture upside"],
        cons:["Very sensitive to pandemics, recessions","Shorter leases, more volatile DPU"],
        description:"Own hotels across Singapore and Asia. These are the most volatile — as COVID proved. But Singapore's tourism rebound has been strong and hospitality REITs have recovered significantly." },
      { icon:"🏥", name:"Healthcare REITs", badge:"badge-green",
        examples:"Parkway Life REIT (PLife REIT)",
        pros:["Extremely stable — hospitals don't close","Long leases with built-in rent escalators","Defensive during recessions"],
        cons:["Limited number in Singapore","Lower yields due to stability premium"],
        description:"Own hospitals and nursing homes. Parkway Life REIT owns hospitals like Gleneagles. These are arguably the most defensive REITs — people always need healthcare, rain or shine." },
    ];

    const COMPARE_DATA = [
      { feature:"Entry cost", reit:"Low (from ~S$200)", property:"High (S$500K+)", stocks:"Low", bonds:"Medium", cpf:"None (auto)" },
      { feature:"Liquidity", reit:"High (SGX-listed)", property:"Very Low", stocks:"High", bonds:"Medium", cpf:"Locked" },
      { feature:"Passive income", reit:"Yes (quarterly)", property:"Yes (rental)", stocks:"Some (dividends)", bonds:"Yes (coupon)", cpf:"Yes (interest)" },
      { feature:"Typical yield", reit:"5–7%", property:"2–4%", stocks:"2–4%", bonds:"3–5%", cpf:"2.5–5%" },
      { feature:"Diversification", reit:"High (many assets)", property:"Low (1 unit)", stocks:"High", bonds:"Medium", cpf:"None" },
      { feature:"Hassle factor", reit:"None", property:"High (tenants!)", stocks:"None", bonds:"None", cpf:"None" },
      { feature:"Tax on income", reit:"0% (tax-exempt)", property:"Yes", stocks:"0% (SG dividends)", bonds:"Yes", cpf:"No" },
      { feature:"Gearing limit", reit:"50% (MAS-regulated)", property:"Up to you", stocks:"N/A", bonds:"N/A", cpf:"N/A" },
    ];

    const QUIZ_DATA = [
      { q:"What does REIT stand for?", opts:["Real Estate Investment Trust","Real Estate Interest Trust","Revenue Equity Investment Tax","Real Estate Income Tax"], ans:0, exp:"REIT = Real Estate Investment Trust. You pool money with other investors to own properties like malls and offices, and collect rent as dividends." },
      { q:"Under MAS regulations, how much of its income must a Singapore REIT distribute to enjoy tax-exempt status?", opts:["At least 70%","At least 80%","At least 90%","100%"], ans:2, exp:"Singapore REITs must distribute at least 90% of their taxable income to unit holders to enjoy tax transparency. This is why they are great income vehicles!" },
      { q:"What is the MAS-mandated maximum gearing (debt) limit for Singapore REITs?", opts:["30%","40%","50%","60%"], ans:2, exp:"MAS limits S-REIT gearing to 50% of asset value. This protects investors from over-leveraged REITs that could collapse in a downturn." },
      { q:"What does DPU stand for in REIT investing?", opts:["Dividend Per Unit","Distribution Per Unit","Daily Price Update","Debt Per Unit"], ans:1, exp:"DPU = Distribution Per Unit. This is the amount of income paid out per REIT unit you hold — the key number to track as an income investor." },
      { q:"A REIT is trading at S$1.20 and its NAV per unit is S$1.50. What is the Price-to-NAV ratio, and what does it mean?", opts:["0.8 — the REIT is overvalued","1.25 — you are buying at a premium","0.8 — the REIT is trading at a discount (potentially undervalued)","1.5 — this is the fair value"], ans:2, exp:"Price ÷ NAV = 1.20 ÷ 1.50 = 0.80. Below 1.0 means you're buying $1.50 worth of property for $1.20 — potentially a bargain. But always check WHY it's trading at a discount!" },
      { q:"Which type of REIT is generally considered the most defensive (stable) investment?", opts:["Hospitality REIT","Retail REIT","Healthcare REIT","Industrial REIT"], ans:2, exp:"Healthcare REITs (like Parkway Life REIT) own hospitals and nursing homes. People always need medical care, making these REITs very stable even during recessions." },
      { q:"What is 'gearing' in the context of REITs?", opts:["The number of properties the REIT owns","The ratio of debt to the total asset value","The management fee paid to the REIT manager","The speed at which the REIT grows"], ans:1, exp:"Gearing = total debt ÷ total assets. A 45% gearing means 45 cents of every $1 of property is funded by debt. Higher gearing = higher risk but potentially higher returns." },
      { q:"If a REIT pays a DPU of 5 cents and you hold 10,000 units, how much would you receive in that distribution?", opts:["S$5","S$50","S$500","S$5,000"], ans:2, exp:"5 cents × 10,000 units = S$500. That's the beauty of REITs — passive income deposited into your brokerage account every quarter, no tenant calls required!" },
      { q:"What is Net Property Income (NPI)?", opts:["The total rental income collected","Rental income minus property operating expenses","The total value of all properties","The dividend paid to unit holders"], ans:1, exp:"NPI = Gross Rental Income − Operating Expenses (maintenance, utilities, property tax). It's the true earnings power of the properties. Watch for NPI growth over time!" },
      { q:"Which of the following is a red flag when evaluating a REIT?", opts:["Occupancy rate above 95%","Gearing ratio of 48% with debt maturing all in one year","DPU has been growing steadily for 5 years","Interest coverage ratio of 4x"], ans:1, exp:"High gearing (near 50% limit) with debt all maturing at once is dangerous — the REIT may struggle to refinance in a tight credit environment. Always check the debt maturity schedule!" },
    ];

    const ANALYSIS_STEPS = [
      { num:1, title:"Check the Distribution Yield", desc:"Yield = Annual DPU ÷ Current Price. A healthy S-REIT typically yields 4–7%. Too low? Maybe overpriced. Too high (>8%)? Could signal risk — dig deeper." },
      { num:2, title:"Look at Price-to-NAV (P/NAV)", desc:"Below 1.0 = buying at a discount to property value (potentially undervalued). Above 1.0 = paying a premium. Use this alongside other metrics." },
      { num:3, title:"Check Gearing (Debt Level)", desc:"Under 40%? Comfortable. 40–45%? Keep an eye on it. Above 45%? That's approaching the MAS 50% limit — risky in a rising interest rate environment." },
      { num:4, title:"Review Interest Coverage Ratio", desc:"NPI ÷ Interest Expense. Above 3x is generally healthy — means even if income drops, they can still service debt. Below 2x is a yellow flag." },
      { num:5, title:"Check Occupancy Rates", desc:"High-quality REITs maintain 95%+ occupancy across cycles. Watch for trends — is occupancy dropping over time? That's a warning sign." },
      { num:6, title:"Look at DPU Trend (5-year)", desc:"Has DPU been growing, stable, or declining? Consistent growth is what you want. A declining DPU despite rising revenue = red flag (too many new units being issued)." },
      { num:7, title:"Assess the Sponsor Quality", desc:"Who backs this REIT? CapitaLand, Mapletree, Frasers — these are strong sponsors with deep pipelines of quality assets to inject. Weaker sponsors = more risk." },
      { num:8, title:"Read the Debt Maturity Schedule", desc:"Is a big chunk of debt maturing all at once? That's a refinancing cliff — dangerous if credit markets tighten. Good REITs spread their maturities evenly." },
    ];

    const PITFALLS = [
      { title:"Chasing the Highest Yield", desc:"A REIT yielding 10%+ sounds amazing — but it often signals the market expects a DPU cut. Always ask WHY the yield is so high before buying." },
      { title:"Ignoring Gearing Levels", desc:"High debt (>45%) is fine in good times but ugly in crises. REITs near the 50% MAS limit have very little buffer for acquisitions or emergencies." },
      { title:"Overlooking Currency Risk", desc:"Many S-REITs own overseas properties (Australia, China, Japan). Their income is in foreign currency — a strong SGD can eat into your actual dividends." },
      { title:"Confusing DPU Growth with Value Creation", desc:"Some REITs grow DPU by constantly issuing new units to fund acquisitions. If the number of units grows faster than income, each unit is worth less over time." },
      { title:"Not Reading Debt Maturity Schedules", desc:"REITs that borrowed at 2% in 2020 will face much higher costs when refinancing. A REIT with 60% of debt due in one year in a high-rate environment is risky." },
      { title:"Ignoring the Sponsor Track Record", desc:"The REIT manager controls what assets get injected at what price. A sponsor known for dumping overpriced assets onto the REIT destroys unit holder value over time." },
    ];

    // ── CALCULATORS ──
    function YieldCalc() {
      const [price, setPrice] = useState("1.80");
      const [dpu, setDpu] = useState("0.10");
      const y = price && dpu ? ((parseFloat(dpu)/parseFloat(price))*100).toFixed(2) : null;
      return (
        <div>
          <div className="calc-group"><label className="calc-label">Current Unit Price (S$)</label><input className="calc-input" type="number" value={price} onChange={e=>setPrice(e.target.value)} /></div>
          <div className="calc-group"><label className="calc-label">Annual DPU — Distribution Per Unit (S$)</label><input className="calc-input" type="number" value={dpu} onChange={e=>setDpu(e.target.value)} /></div>
          {y && !isNaN(y) && <div className="calc-result fade-up"><div className="big">{y}%</div><div className="small">Distribution Yield</div></div>}
        </div>
      );
    }

    function PBCalc() {
      const [price, setPrice] = useState("1.20");
      const [nav, setNav] = useState("1.50");
      const pb = price && nav ? (parseFloat(price)/parseFloat(nav)).toFixed(3) : null;
      const st = pb ? (parseFloat(pb)<0.9 ? {label:"Trading at Discount 🟢",sub:"Potentially undervalued — buying properties for less than they're worth"} : parseFloat(pb)>1.1 ? {label:"Trading at Premium 🔴",sub:"You're paying more than the underlying property value"} : {label:"Near Fair Value 🟡",sub:"Trading close to the intrinsic value of the properties"}) : null;
      return (
        <div>
          <div className="calc-group"><label className="calc-label">Current Unit Price (S$)</label><input className="calc-input" type="number" value={price} onChange={e=>setPrice(e.target.value)} /></div>
          <div className="calc-group"><label className="calc-label">NAV Per Unit (S$) — from latest report</label><input className="calc-input" type="number" value={nav} onChange={e=>setNav(e.target.value)} /></div>
          {pb && !isNaN(pb) && <div className="calc-result fade-up"><div className="big">{pb}x</div><div className="small">{st.label}</div><div className="small" style={{marginTop:6,opacity:0.8}}>{st.sub}</div></div>}
        </div>
      );
    }

    function IncomeCalc() {
      const [invested, setInvested] = useState("10000");
      const [yp, setYp] = useState("6");
      const fmt = n => isNaN(n) ? "-" : "S$" + parseFloat(n).toLocaleString("en-SG",{minimumFractionDigits:2});
      const annual = invested && yp ? parseFloat(invested)*parseFloat(yp)/100 : null;
      const monthly = annual ? annual/12 : null;
      const quarterly = annual ? annual/4 : null;
      return (
        <div>
          <div className="calc-group"><label className="calc-label">Amount Invested (S$)</label><input className="calc-input" type="number" value={invested} onChange={e=>setInvested(e.target.value)} /></div>
          <div className="calc-group"><label className="calc-label">REIT Distribution Yield (%)</label><input className="calc-input" type="number" value={yp} step="0.1" onChange={e=>setYp(e.target.value)} /></div>
          {annual!==null && !isNaN(annual) && (
            <div className="calc-result fade-up">
              <div className="big">{fmt(annual)}</div>
              <div className="small">Annual Passive Income</div>

    function QuizSection() {
      const [current, setCurrent] = useState(0);
      const [selected, setSelected] = useState(null);
      const [score, setScore] = useState(0);
      const [done, setDone] = useState(false);
      const [answers, setAnswers] = useState([]);
      const q = QUIZ_DATA[current];
      const pick = i => {
        if (selected!==null) return;
        setSelected(i);
        if (i===q.ans) setScore(s=>s+1);
        setAnswers(a=>[...a,{correct:i===q.ans}]);
      };
      const next = () => { if (current+1>=QUIZ_DATA.length) setDone(true); else { setCurrent(c=>c+1); setSelected(null); } };
      const restart = () => { setCurrent(0); setSelected(null); setScore(0); setDone(false); setAnswers([]); };
      if (done) {
        const pct = Math.round((score/QUIZ_DATA.length)*100);
        const grade = pct>=80?{label:"REIT Pro! 🎉",color:C.accent}:pct>=60?{label:"Good Start! 📚",color:C.gold}:{label:"Keep Learning! 💪",color:C.muted};
        return (
          <div className="quiz-card fade-up" style={{textAlign:"center"}}>
            <div style={{fontSize:"3.5rem",marginBottom:12}}>{pct>=80?"🏆":pct>=60?"📈":"📖"}</div>
            <h3 style={{fontFamily:"'Playfair Display',serif",fontSize:"1.8rem",marginBottom:8,color:grade.color}}>{grade.label}</h3>
            <p style={{color:C.muted,marginBottom:24}}>You scored <strong style={{color:C.text}}>{score} out of {QUIZ_DATA.length}</strong> ({pct}%)</p>
            <div className="grid-3" style={{marginBottom:24}}>
              {QUIZ_DATA.map((_,i)=><div key={i} style={{padding:"8px",borderRadius:"8px",background:answers[i]?.correct?C.accentXL:C.dangerL,color:answers[i]?.correct?C.accent:C.danger,fontSize:"0.82rem",fontWeight:600}}>Q{i+1}: {answers[i]?.correct?"✓":"✗"}</div>)}
            </div>
            <button className="btn-primary" onClick={restart}>Try Again</button>
          </div>
        );
      }
      return (
        <div className="quiz-card">
          <div className="quiz-progress">{QUIZ_DATA.map((_,i)=><div key={i} className={`quiz-dot ${i<current?"done":i===current?"current":""}`}/>)}</div>
          <p style={{fontSize:"0.78rem",color:C.muted,marginBottom:16,fontWeight:600,letterSpacing:"0.5px"}}>QUESTION {current+1} OF {QUIZ_DATA.length}</p>
          <div className="quiz-q">{q.q}</div>
          {q.opts.map((o,i)=>{
            let cls="quiz-opt";
            if (selected!==null) { if (i===q.ans) cls+=" correct"; else if (i===selected&&selected!==q.ans) cls+=" wrong"; }
            return <button key={i} className={cls} onClick={()=>pick(i)} disabled={selected!==null}>{o}</button>;
          })}
          {selected!==null && <div className="callout fade-up" style={{marginTop:16}}><strong>{selected===q.ans?"✅ Correct!":"❌ Not quite."}</strong> {q.exp}</div>}
          {selected!==null && <button className="btn-primary" style={{marginTop:16}} onClick={next}>{current+1>=QUIZ_DATA.length?"See Results":"Next Question →"}</button>}
        </div>
      );
    }

    const FAQ_DATA = [
      { q:"What's the difference between DPU and yield?", a:"DPU (Distribution Per Unit) is the actual dollar amount paid out per unit — e.g. 10 cents per unit. Yield is DPU expressed as a percentage of the current price. So if a REIT trades at S$2.00 and pays 10 cents DPU, the yield is 5%. DPU tells you the absolute payout; yield tells you the return relative to what you paid." },
      { q:"Is a P/NAV below 1 always a good buy?", a:"Not necessarily! A P/NAV below 1.0 means you're buying properties for less than their book value — which sounds great. But ask yourself WHY it's cheap. Is the sector struggling? Are the properties declining in quality? Is the sponsor unreliable? A discount can be a bargain or a value trap. Always combine P/NAV with yield, gearing, and DPU trend." },
      { q:"How often do Singapore REITs pay distributions?", a:"Most S-REITs pay quarterly (4 times a year), though some pay semi-annually (twice a year). The distribution is deposited directly into your brokerage account — no action needed from you. This regular income is one of the main reasons investors love REITs for passive income." },
      { q:"What happens if a REIT breaches the 50% gearing limit?", a:"MAS requires REITs to stay within the 50% gearing cap. If a REIT breaches this limit, it must take corrective action — typically by raising equity (issuing new units, which dilutes existing holders) or selling assets to pay down debt. This is why gearing above 45% is a warning sign — there's very little room for error." },
      { q:"Can I use CPF to invest in REITs?", a:"Yes! Under the CPF Investment Scheme (CPFIS), you can use your CPF Ordinary Account (OA) funds to invest in SGX-listed REITs. Your OA currently earns 2.5% — if the REIT yields 5–6%, you could potentially earn more. However, unlike CPF interest, REIT unit prices can fall, so your capital is at risk. Only invest CPF funds you won't need in the short term." },
      { q:"What is WALE and why does it matter?", a:"WALE stands for Weighted Average Lease Expiry — the average time remaining on all the REIT's leases, weighted by income. A WALE of 5 years means tenants are locked in for an average of 5 more years. Higher WALE = more income certainty. A low WALE (under 2 years) means many leases are expiring soon, which introduces risk if tenants don't renew or demand lower rents." },
      { q:"What's the difference between a REIT and a Business Trust?", a:"REITs must distribute at least 90% of income and are restricted to owning real estate assets. Business Trusts have more flexibility — they can retain earnings and invest in operating businesses. However, Business Trusts don't enjoy the same tax transparency as REITs. Examples of Business Trusts on SGX include Hutchison Port Holdings Trust and Netlink NBN Trust." },

    function LiveREITTable() {
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(false);
      const [loaded, setLoaded] = useState(false);
      const fetchData = async () => {
        setLoading(true);
        try {
          const res = await fetch("https://api.anthropic.com/v1/messages", {
            method:"POST", headers:{"Content-Type":"application/json"},
            body: JSON.stringify({ model:"claude-sonnet-4-20250514", max_tokens:1000,
              system:"Return ONLY a valid JSON array. No markdown, no backticks, no preamble.",
              messages:[{role:"user",content:`Give me a JSON array of 10 major Singapore REITs as of May 2026. Each object: name, ticker, sector, price (SGD number), yield_pct (number), p_nav (number), gearing_pct (number), trend ("up","down","stable"). Include: CICT, Ascendas REIT, Mapletree Pan Asia, Keppel REIT, FCT, CDL Hospitality Trusts, Mapletree Logistics Trust, Suntec REIT, Parkway Life REIT, Frasers Logistics Trust. Return only the JSON array.`}] })
          });
          const json = await res.json();
          const text = json.content?.find(b=>b.type==="text")?.text||"[]";
          setData(JSON.parse(text.replace(/```json|```/g,"").trim()));
        } catch { setData([]); }
        setLoading(false); setLoaded(true);
      };
      const ti = t=>t==="up"?"📈":t==="down"?"📉":"➡️";
      const pc = v=>v<0.9?C.accent:v>1.1?C.danger:C.gold;
      const yc = v=>v>=6?C.accent:v<4?C.danger:C.gold;
      return (
        <div>
          <div className="callout" style={{marginBottom:20}}><strong>📊 Indicative Data</strong> — AI-generated approximate figures for education only. Always verify on SGX or the REIT's investor relations page before investing.</div>
          {!loaded && <div style={{textAlign:"center",padding:"30px 0"}}><button className="btn-primary" onClick={fetchData} disabled={loading}>{loading?"Loading REIT Data…":"📊 Load REIT Data Table"}</button></div>}

            <div className="table-wrap fade-up">
              <table><thead><tr><th>REIT</th><th>Ticker</th><th>Sector</th><th>Price (S$)</th><th>Yield (%)</th><th>P/NAV</th><th>Gearing (%)</th><th>Trend</th></tr></thead>
              <tbody>{data.map((r,i)=><tr key={i}><td><strong>{r.name}</strong></td><td><span className="badge badge-blue">{r.ticker}</span></td><td>{r.sector}</td><td>S${parseFloat(r.price).toFixed(2)}</td><td style={{color:yc(r.yield_pct),fontWeight:600}}>{parseFloat(r.yield_pct).toFixed(1)}%</td><td style={{color:pc(r.p_nav),fontWeight:600}}>{parseFloat(r.p_nav).toFixed(2)}x</td><td style={{color:r.gearing_pct>45?C.danger:C.text}}>{parseFloat(r.gearing_pct).toFixed(1)}%</td><td>{ti(r.trend)}</td></tr>)}</tbody>
              </table>
            </div>
          )}
          {loaded && data && data.length===0 && <div className="callout callout-warn">Could not load data. Please try again.</div>}
        </div>
      );
    }

          <div className="grid-2">{PITFALLS.map(p=><div key={p.title} className="pitfall-card"><h4>⚠️ {p.title}</h4><p style={{fontSize:"0.88rem"}}>{p.desc}</p></div>)}</div>
          <div className="callout" style={{marginTop:40}}><strong>💡 The Golden Rule:</strong> Never buy a REIT just because the yield looks high. Always ask: Is the DPU sustainable? Is gearing manageable? Does the sponsor have a good track record? A REIT yielding 3.5% that grows consistently is worth far more than one yielding 9% that's about to cut its distribution.</div>

          {tab==="pb" && <div className="card"><h4 style={{marginBottom:6}}>Price-to-NAV Calculator</h4><p style={{fontSize:"0.85rem",color:C.muted,marginBottom:20}}>NAV = the book value of all properties minus debts, divided by units. This tells you if you're getting a bargain.</p><PBCalc /><div className="callout" style={{marginTop:20}}><strong>Wesley's tip:</strong> Historical P/NAV is powerful. If a REIT historically trades at 1.0x but is currently at 0.75x during a market panic, that could be a buying opportunity.</div></div>}
          {tab==="income" && <div className="card"><h4 style={{marginBottom:6}}>Passive Income Calculator</h4><p style={{fontSize:"0.85rem",color:C.muted,marginBottom:20}}>How much passive income could your investment generate? Enter the amount you plan to invest and the REIT's distribution yield.</p><IncomeCalc /><div className="callout" style={{marginTop:20}}><strong>Fun math:</strong> To generate S$1,000/month (S$12,000/year) from a REIT yielding 6%, you'd need to invest approximately S$200,000.</div></div>}

          case "REITs vs Others": return <ComparisonPage/>;
