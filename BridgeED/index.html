  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

nt(to right, rgba(0,0,0,0.04) 1px, transparent 1px),\n      linear-gradient(to bottom, rgba(0,0,0,0.04) 1px, transparent 1px);\n    background-size: 40px 40px;\n  }\n\n  .frame {\n    position: absolute; inset: 0;\n    padding: 80px 96px 80px;\n    display: flex; flex-direction: column;\n  }\n\n  /* ===== Topbar ===== */\n  .topbar {\n    display: flex; justify-content: space-between; align-items: center;\n    font-family: var(--mono); font-size: 24px;\n    text-transform: uppercase; letter-spacing: 0.12em;\n    color: var(--mute);\n    border-bottom: 2px dashed var(--line-3);\n    padding-bottom: 24px;\n  }\n  .topbar .brand {\n    display: flex; align-items: center; gap: 14px; color: var(--ink); font-weight: 600;\n  }\n  .topbar .brand .mark {\n    width: 28px; height: 28px;\n    border: 2px solid var(--ink);\n    position: relative;\n  }\n  .topbar .brand .mark::after {\n    content: ''; position: absolute; inset: 6px;\n    background: var(--accent);\n  }\n  .topbar .pagenum { font-variant-numeric: tabular-nums; }\n\n  /* ===== Footer ===== */\n  .footer {\n    position: absolute; left: 96px; right: 96px; bottom: 40px;\n    display: flex; justify-content: space-between;\n    font-family: var(--mono); font-size: 24px;\n    letter-spacing: 0.12em; text-transform: uppercase;\n    color: var(--mute);\n    border-top: 2px dashed var(--line-3);\n    padding-top: 18px;\n  }\n\n  /* ===== Header titles ===== */\n  .screen-meta {\n    display: flex; align-items: baseline; gap: 16px;\n    margin-top: 28px;\n  }\n  .title-col .screen-meta { margin-top: 0; }\n  .screen-meta .step {\n    font-family: var(--mono); font-size: 24px; color: var(--accent);\n    letter-spacing: 0.16em; text-transform: uppercase; font-weight: 600;\n  }\n  .screen-meta .of { font-family: var(--mono); font-size: 24px; color: var(--mute); letter-spacing: 0.12em; }\n  .screen-title {\n    font-family: var(--hand); font-size: 88px; line-height: 1; margin-top: 12px;\n    color: var(--ink);\n  }\n  .screen-blurb {\n    font-family: var(--mono); font-size: 24px; line-height: 1.4; color: var(--mute);\n    margin-top: 18px;\n  }\n\n  /* ===== Body grid (3 cols: title · phone · callouts) ===== */\n  .body-area { flex: 1; display: grid; grid-template-columns: 1fr 360px 1fr; gap: 64px; margin-top: 32px; padding-bottom: 60px; align-items: start; }\n  .title-col { padding-top: 16px; }\n  .stage { display: flex; align-items: center; justify-content: center; position: relative; }\n  .info  { display: flex; flex-direction: column; gap: 24px; align-self: center; }\n\n  /* ===== Phone wireframe ===== */\n  .phone {\n    position: relative;\n    width: 300px; height: 600px;\n    border: 3px solid var(--line);\n    border-radius: 38px;\n    background: white;\n    padding: 14px;\n    box-shadow: 6px 6px 0 rgba(0,0,0,0.08);\n  }\n  .phone .notch {\n    position: absolute; top: 18px; left: 50%; transform: translateX(-50%);\n    width: 80px; height: 18px;\n    border: 2px solid var(--line); border-radius: 9px;\n    background: white;\n  }\n  .phone .screen {\n    width: 100%; height: 100%;\n    border: 2px dashed var(--line-3);\n    border-radius: 24px;\n    padding: 38px 12px 12px;\n    display: flex; flex-direction: column; gap: 7px;\n    overflow: hidden;\n    position: relative;\n  }\n  /* Status bar */\n  .statusbar {\n    position: absolute; top: 16px; left: 24px; right: 24px;\n    display: flex; justify-content: space-between;\n    font-family: var(--mono); font-size: 11px; color: var(--line-2);\n    letter-spacing: 0.1em;\n  }\n\n  /* Reusable wireframe atoms */\n  .wf-box {\n    border: 2px solid var(--line);\n    padding: 10px 12px;\n    font-family: var(--mono); font-size: 12px;\n    color: var(--ink);\n    background: white;\n  }\n  .wf-box.dashed { border-style: dashed; border-color: var(--line-2); color: var(--mute); }\n  .wf-box.fill   { background: var(--paper-2); }\n  .wf-box.dark   { background: var(--ink); color: white; text-align: center; }\n  .wf-box.accent { border-color: var(--accent); color: var(--accent); }\n  .wf-line {\n    height: 8px; background: var(--paper-2); border-radius: 0;\n  }\n  .wf-line.short { width: 60%; }\n  .wf-line.shorter { width: 40%; }\n  .wf-line.dark { background: var(--ink); height: 12px; }\n  .wf-stack { display: flex; flex-direction: column; gap: 6px; }\n\n  /* Diagonal-hatch image placeholder */\n  .wf-img {\n    background: repeating-linear-gradient(\n      45deg,\n      var(--paper-2) 0 6px,\n      white 6px 12px\n    );\n    border: 2px solid var(--line);\n    display: flex; align-items: center; justify-content: center;\n    font-family: var(--mono); font-size: 11px; color: var(--mute);\n    text-transform: uppercase; letter-spacing: 0.1em;\n  }\n\n  /* Hand-drawn arrow + label callouts */\n  .callout {\n    display: grid; grid-template-columns: 48px 1fr; gap: 18px;\n    align-items: start;\n    padding: 12px 0;\n    border-top: 1px solid var(--line-3);\n  }\n  .callout:last-child { border-bottom: 1px solid var(--line-3); }\n  .callout .marker {\n    font-family: var(--hand); font-size: 32px; color: var(--accent);\n    line-height: 1;\n  }\n  .callout .text {\n    font-family: var(--mono); font-size: 24px; line-height: 1.35;\n    color: var(--ink);\n  }\n  .callout .text strong {\n    font-family: var(--hand); font-weight: 400; font-size: 26px;\n    color: var(--ink); display: block; margin-bottom: 2px;\n  }\n\n  /* ===== Cover slide ===== */\n  .cover { background: var(--paper); }\n  .cover .frame { padding: 100px 120px; }\n  .cover-title {\n    font-family: var(--hand); font-size: 140px; line-height: 0.95;\n    color: var(--ink); margin-top: 36px;\n    max-width: 1500px;\n  }\n  .cover-sub {\n    font-family: var(--mono); font-size: 28px; color: var(--mute);\n    margin-top: 28px; max-width: 1200px; line-height: 1.4;\n  }\n  .cover-meta {\n    display: grid; grid-template-columns: repeat(4, auto); gap: 80px; margin-top: 56px;\n    font-family: var(--mono); font-size: 28px;\n  }\n  .cover-meta .k { display: block; font-size: 24px; color: var(--mute); letter-spacing: 0.16em; text-transform: uppercase; margin-bottom: 8px; }\n\n  /* ===== Map / journey slide ===== */\n  .map-grid {\n    display: grid; grid-template-columns: repeat(4, 1fr); gap: 32px;\n    margin-top: 60px;\n  }\n  .map-card {\n    border: 2px solid var(--line);\n    background: white;\n    padding: 28px 24px;\n    display: flex; flex-direction: column; gap: 14px;\n    position: relative;\n  }\n  .map-card .map-step {\n    font-family: var(--mono); font-size: 24px; color: var(--accent);\n    letter-spacing: 0.16em; font-weight: 600;\n  }\n  .map-card .map-name {\n    font-family: var(--hand); font-size: 48px; line-height: 1; color: var(--ink);\n  }\n  .map-card .map-desc {\n    font-family: var(--mono); font-size: 24px; color: var(--mute); line-height: 1.4;\n  }\n  .map-card .mini-phone {\n    margin-top: 14px;\n    border: 2px solid var(--line); border-radius: 14px;\n    height: 220px; background: white;\n    display: flex; flex-direction: column; gap: 6px;\n    padding: 14px 10px;\n  }\n  .map-card .mini-phone .ml {\n    height: 6px; background: var(--paper-2);\n  }\n  .map-card .mini-phone .ml.short { width: 50%; }\n  .map-card .mini-phone .mh {\n    height: 10px; background: var(--ink); width: 70%;\n  }\n  .map-card .mini-phone .mblock {\n    flex: 1; background: repeating-linear-gradient(45deg, var(--paper-2) 0 6px, white 6px 12px);\n    border: 1px dashed var(--line-2);\n  }\n  .map-card .mini-phone .mcta {\n    height: 22px; background: var(--ink); margin-top: 6px;\n  }\n  .map-card::after {\n    content: '→';\n    position: absolute; right: -28px; top: 50%; transform: translateY(-50%);\n    font-family: var(--hand); font-size: 48px; color: var(--accent);\n    pointer-events: none;\n  }\n  .map-card:last-child::after { content: ''; }\n\n  /* small helpers */\n  .row { display: flex; gap: 8px; align-items: center; }\n  .grow { flex: 1; }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n\n\n
